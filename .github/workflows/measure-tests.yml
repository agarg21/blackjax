# Fork-only measurement harness: test.yml's test job, dispatch only, no Codecov upload.
name: measure-tests
on:
  workflow_dispatch:
jobs:
  test:
    name: Run tests for Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
    - uses: actions/checkout@v3
    - name: CPU and memory info
      run: |
        nproc; free -m; grep -m1 'model name' /proc/cpuinfo
        (peak=0; while sleep 5; do u=$(free -m | awk '/Mem:/{print $3}'); if [ "$u" -gt "$peak" ]; then peak=$u; echo "$peak" > /tmp/peak_mem_mb; fi; done) &
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up test environment
      run: uv sync --group dev --extra progress
    - name: Run tests
      run: |
        uv run pytest -n 3 -vv --benchmark-disable --cov=blackjax --cov-report=xml --cov-report=term tests
    - name: Peak memory
      if: always()
      run: echo "peak used MB $(cat /tmp/peak_mem_mb)"; free -m
